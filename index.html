<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Top Bar -->
    <header class="flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200 gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-800">Leave Management System</h1>
        <p class="text-xs text-slate-500">Workspace Mode Active</p>
      </div>
      
      <!-- Role Selector -->
      <div class="flex items-center space-x-2 bg-slate-50 p-2 rounded-lg border">
        <label class="text-xs font-semibold text-slate-600">Logged in as:</label>
        <select id="userSession" onchange="switchUserSession()" class="text-xs font-bold border rounded p-1 bg-white">
          <option value="USR003|employee_user|User">employee_user (User)</option>
          <option value="USR002|manager_user|Manager">manager_user (Manager)</option>
          <option value="USR001|admin_user|Admin">admin_user (Admin)</option>
        </select>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- User Form -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-slate-800 mb-4">Log Time Off</h2>
        <form id="leaveForm" onsubmit="submitTimeOff(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">User Name</label>
            <input type="text" id="formUserName" readonly class="w-full border rounded p-2 text-sm bg-slate-100 font-medium">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Type</label>
            <select id="leaveType" class="w-full border rounded p-2 text-sm">
              <option value="PTO">Paid Time Off (PTO)</option>
              <option value="WFH">Work From Home (WFH)</option>
              <option value="Comp-Off">Comp-Off</option>
              <option value="Optional Holiday">Optional Holiday</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Start Date</label>
              <input type="date" id="startDate" required class="w-full border rounded p-2 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">End Date</label>
              <input type="date" id="endDate" required class="w-full border rounded p-2 text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Notes / Reason</label>
            <input type="text" id="notes" class="w-full border rounded p-2 text-sm" placeholder="Optional details">
          </div>
          <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded text-sm">Log Time-Off</button>
        </form>
      </div>

      <!-- Leaves Table -->
      <div class="md:col-span-2 bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-bold text-slate-800" id="tableTitle">Time Off Logs</h2>
          <span id="roleBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-100 text-blue-800">User Mode</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 border-b">
              <tr>
                <th class="p-2">Employee</th>
                <th class="p-2">Type</th>
                <th class="p-2">Dates</th>
                <th class="p-2">Notes</th>
              </tr>
            </thead>
            <tbody id="teamLeavesTable">
              <tr><td colspan="4" class="p-4 text-center text-slate-400">Loading data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      
    </div>

    <!-- Holiday List -->
    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <h2 class="font-bold text-slate-800 mb-3">Holiday List Reference (Public & Optional)</h2>
      <div class="max-h-60 overflow-y-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 sticky top-0 border-b">
            <tr>
              <th class="p-2">Date</th>
              <th class="p-2">Holiday</th>
              <th class="p-2">Category</th>
            </tr>
          </thead>
          <tbody id="holidayTable">
            <tr><td colspan="3" class="p-4 text-center text-slate-400">Loading holidays...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/a/macros/flipkart.com/s/AKfycbyp1c_VWZNY8YMoVKgFCFq9jaJ6iwWdtu88I49LheOe9PpobiJVPRf552q3X-0-WlkUKw/exec"; 
    let currentUser = { id: "", username: "", role: "" };

    function switchUserSession() {
      const userSelect = document.getElementById("userSession");
      if (!userSelect) return;

      const val = userSelect.value.split("|");
      currentUser = { id: val[0], username: val[1], role: val[2] };
      
      const formInput = document.getElementById("formUserName");
      if (formInput) formInput.value = currentUser.username;
      
      const badge = document.getElementById("roleBadge");
      const title = document.getElementById("tableTitle");
      
      if (currentUser.role === "User") {
        if (badge) {
          badge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-700";
          badge.innerText = "Private Mode";
        }
        if (title) title.innerText = "My Time Off Records";
      } else {
        if (badge) {
          badge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-purple-100 text-purple-800";
          badge.innerText = currentUser.role + " View (All Records)";
        }
        if (title) title.innerText = "Team Time Off Overview";
      }

      fetchFilteredLeaves();
    }

    function fetchFilteredLeaves() {
      const container = document.getElementById("teamLeavesTable");
      if (container) {
        container.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-400">Loading data...</td></tr>';
      }
      
      const oldScript = document.getElementById("jsonp_leaves");
      if (oldScript) oldScript.remove();

      const script = document.createElement("script");
      script.id = "jsonp_leaves";
      script.src = API_URL + "?action=getLeaves&role=" + currentUser.role + "&username=" + currentUser.username + "&callback=renderLeaves";
      document.body.appendChild(script);
    }

    function renderLeaves(data) {
      const rows = data.slice(1);
      let html = "";
      if (rows.length === 0) {
        html = '<tr><td colspan="4" class="p-4 text-center text-slate-400">No time-off records found.</td></tr>';
      } else {
        rows.reverse().forEach(function(r) {
          html += '<tr class="border-b">' +
            '<td class="p-2 font-medium">' + r[1] + '</td>' +
            '<td class="p-2"><span class="px-2 py-0.5 rounded text-xs bg-blue-100 text-blue-800">' + r[2] + '</span></td>' +
            '<td class="p-2">' + r[4] + ' to ' + r[5] + '</td>' +
            '<td class="p-2 text-slate-500">' + (r[6] || '-') + '</td>' +
          '</tr>';
        });
      }
      const container = document.getElementById("teamLeavesTable");
      if (container) container.innerHTML = html;
    }

    function fetchHolidays() {
      const oldScript = document.getElementById("jsonp_holidays");
      if (oldScript) oldScript.remove();

      const script = document.createElement("script");
      script.id = "jsonp_holidays";
      script.src = API_URL + "?action=getHolidays&callback=renderHolidays";
      document.body.appendChild(script);
    }

    function renderHolidays(data) {
      const rows = data.slice(1);
      let html = "";
      rows.forEach(function(r) {
        html += '<tr class="border-b">' +
          '<td class="p-2">' + r[2] + '</td>' +
          '<td class="p-2 font-medium">' + r[1] + '</td>' +
          '<td class="p-2"><span class="px-2 py-0.5 rounded text-xs ' + (r[3] === 'Public' ? 'bg-green-100 text-green-800' : 'bg-purple-100 text-purple-800') + '">' + r[3] + '</span></td>' +
        '</tr>';
      });
      const container = document.getElementById("holidayTable");
      if (container) container.innerHTML = html;
    }

    async function submitTimeOff(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmit");
      btn.innerText = "Saving...";
      btn.disabled = true;

      const payload = {
        action: "logLeave",
        id: "LEV" + Date.now(),
        user_name: currentUser.username,
        type: document.getElementById("leaveType").value,
        start_date: document.getElementById("startDate").value,
        end_date: document.getElementById("endDate").value,
        notes: document.getElementById("notes").value
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        document.getElementById("notes").value = "";
        alert("Time off logged successfully!");
      } catch (err) {
        alert("Saved! Refreshing view...");
      } finally {
        btn.innerText = "Log Time-Off";
        btn.disabled = false;
        setTimeout(fetchFilteredLeaves, 1200);
      }
    }

    window.onload = function() {
      switchUserSession();
      fetchHolidays();
    };
  </script>
</body>
</html>
